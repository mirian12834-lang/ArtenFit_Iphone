<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001930">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MeuTreino">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <meta name="description" content="Treinos de academia organizados por dia, com pesos salvos no navegador, progresso e histórico.">
  <title>MeuTreino</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #001930;
      --bg2: #002548;
      --surface: #002548;
      --surface-2: #002548;
      --surface-3: #002c53;
      --card: #002548;
      --card-strong: #002f5a;
      --text: #eef7fb;
      --muted: #92acb9;
      --line: rgba(152, 208, 227, .12);
      --accent: #00e5ff;
      --accent-2: #00adb5;
      --accent-soft: rgba(0, 229, 255, .11);
      --danger: #ff7589;
      --danger-soft: rgba(255, 117, 137, .12);
      --shadow: 0 18px 42px rgba(0, 0, 0, .22);
      --field: rgba(4, 17, 24, .34);
      --ring: rgba(69, 219, 246, .30);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef4f8;
      --bg2: #e3eef4;
      --surface: #ffffff;
      --surface-2: #f6fafc;
      --surface-3: #e8f1f6;
      --card: #ffffff;
      --card-strong: #f5f9fb;
      --text: #103242;
      --muted: #5d7381;
      --line: rgba(17, 56, 74, .12);
      --accent: #087f9a;
      --accent-2: #055d72;
      --accent-soft: rgba(8, 127, 154, .09);
      --danger: #c63d5a;
      --danger-soft: rgba(198, 61, 90, .08);
      --shadow: 0 16px 34px rgba(24, 66, 88, .09);
      --field: #f7fbfd;
      --ring: rgba(8, 127, 154, .24);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 100% 0%, rgba(69, 219, 246, .11), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(22, 184, 216, .08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      line-height: 1.42;
      overflow-x: hidden;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      border-bottom: 1px solid var(--line);
      padding: max(12px, env(safe-area-inset-top)) 0 14px;
    }

    .shell {
      width: min(100% - 28px, 720px);
      margin: 0 auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-wrap {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .69rem;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.95rem, 8vw, 2.65rem);
      line-height: .98;
      letter-spacing: -.07em;
      font-weight: 900;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .theme-toggle {
      width: 46px;
      height: 46px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
      cursor: pointer;
      flex: 0 0 auto;
      transition: transform .15s ease, border-color .15s ease;
    }

    .theme-toggle:active { transform: scale(.97); }
    .theme-toggle svg { width: 20px; height: 20px; }

    main {
      padding: 18px 0 calc(34px + env(safe-area-inset-bottom));
    }

    .day-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 1px 12px;
      margin: 4px -1px 16px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .day-strip::-webkit-scrollbar { display: none; }

    .day-card {
      flex: 0 0 auto;
      width: 72px;
      min-height: 72px;
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .06);
      display: grid;
      place-items: center;
      padding: 10px 8px;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .day-card:active { transform: scale(.98); }
    .day-card .short {
      display: block;
      text-align: center;
      font-size: .84rem;
      letter-spacing: .08em;
      font-weight: 900;
      color: var(--text);
    }
    .day-card .count {
      display: block;
      margin-top: 3px;
      text-align: center;
      font-size: .7rem;
      line-height: 1.1;
      color: var(--muted);
    }
    .day-card[aria-selected="true"] {
      color: var(--text);
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(69,219,246,.18), rgba(18,51,69,.95));
      box-shadow: 0 12px 30px rgba(69, 219, 246, .10), inset 0 0 0 1px rgba(69,219,246,.12);
    }
    .day-card[aria-selected="true"] .short { color: var(--accent); }

    .section-title {
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-title h2 {
      margin: 0;
      font-size: .92rem;
      letter-spacing: .02em;
      font-weight: 800;
    }
    .section-title span {
      color: var(--muted);
      font-size: .74rem;
    }

    .progress-block {
      margin: 4px 0 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-row strong {
      font-size: .88rem;
      font-weight: 850;
    }
    .progress-row .meta {
      color: var(--muted);
      font-size: .78rem;
      white-space: nowrap;
    }
    .bar {
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(120, 150, 165, .14);
      border: 1px solid rgba(120, 150, 165, .12);
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #43d9f2, #13b8d5);
      box-shadow: 0 0 16px rgba(67, 217, 242, .22);
      transition: width .2s ease;
    }

    .exercise-list {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .exercise-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .10);
      padding: 14px;
    }

    .exercise-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .done-wrap {
      position: relative;
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      margin-top: 3px;
    }
    .done-wrap input {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
    .done-wrap span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1.5px solid rgba(149, 196, 210, .35);
      background: rgba(255, 255, 255, .02);
      transition: .15s ease;
    }
    .done-wrap span::after {
      content: "";
      width: 8px;
      height: 4px;
      border-left: 2px solid transparent;
      border-bottom: 2px solid transparent;
      transform: rotate(-45deg) translate(-1px, -1px);
    }
    .done-wrap input:checked + span {
      border-color: var(--accent);
      background: rgba(67, 217, 242, .12);
      box-shadow: 0 0 0 3px rgba(67, 217, 242, .10);
    }
    .done-wrap input:checked + span::after {
      border-left-color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .exercise-name {
      flex: 1;
      min-width: 0;
      border: 0;
      padding: 1px 0 0;
      margin: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-weight: 850;
      letter-spacing: -.03em;
    }
    .exercise-name::placeholder { color: rgba(210, 225, 230, .7); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      flex: 0 0 auto;
      cursor: pointer;
      transition: .15s ease;
    }
    .icon-btn:hover,
    .icon-btn:active {
      color: var(--danger);
      background: var(--danger-soft);
    }
    .icon-btn svg { width: 18px; height: 18px; }

    .exercise-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 13px;
    }

    .mini-field label {
      display: block;
      margin: 0 0 5px 2px;
      font-size: .66rem;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }
    .mini-field input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      border: 1px solid rgba(145, 185, 200, .20);
      border-radius: 14px;
      background: rgba(3, 14, 20, .20);
      color: var(--text);
      padding: 10px 11px;
      font-size: .9rem;
      font-weight: 700;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .mini-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
      background: rgba(255, 255, 255, .02);
    }
    :root[data-theme="light"] .mini-field input {
      background: #f7fbfd;
    }

    .rest-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .rest-btn,
    .skip-btn {
      border: 0;
      cursor: pointer;
      font-weight: 800;
      border-radius: 999px;
      transition: transform .15s ease, background .15s ease, color .15s ease, opacity .15s ease;
    }

    .rest-btn {
      min-height: 32px;
      padding: 0 12px;
      font-size: .77rem;
      color: var(--accent);
      background: rgba(67, 217, 246, .10);
      border: 1px solid rgba(67, 217, 246, .15);
    }
    .rest-btn:active { transform: scale(.98); }

    .skip-btn {
      min-height: 30px;
      padding: 0 10px;
      font-size: .72rem;
      color: var(--muted);
      background: transparent;
    }
    .skip-btn:hover { color: var(--text); }

    .rest-btn.is-running {
      color: var(--text);
      background: linear-gradient(90deg, rgba(67,217,246,.24), rgba(22,184,216,.18));
      border-color: rgba(67, 217, 246, .28);
    }

    .empty-card {
      padding: 26px 16px;
      text-align: center;
      border-radius: 24px;
      border: 1px dashed var(--line);
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      color: var(--muted);
    }
    .empty-card strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }

    .bottom-panel {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .panel-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
    }

    .timer-bar {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .timer-display {
      min-width: 96px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(67, 217, 246, .22);
      background: rgba(67, 217, 246, .08);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-align: center;
    }

    .timer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary-btn,
    .ghost-btn {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      border: 0;
      font-weight: 850;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, opacity .15s ease;
    }
    .primary-btn:active,
    .ghost-btn:active { transform: scale(.985); }

    .primary-btn {
      color: #06222c;
      background: linear-gradient(90deg, #67e8f9, var(--accent));
      box-shadow: 0 12px 22px rgba(67, 217, 246, .18);
    }
    :root[data-theme="light"] .primary-btn { color: #fff; }
    .ghost-btn {
      color: var(--text);
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--line);
    }

    .progress-mini {
      margin-top: 10px;
    }

    .footer-title {
      margin: 0 0 10px;
      font-size: .82rem;
      letter-spacing: .03em;
      color: var(--text);
      font-weight: 900;
    }

    .footer-grid {
      display: grid;
      gap: 12px;
    }

    .add-form {
      display: grid;
      gap: 8px;
    }
    .add-form .row {
      display: grid;
      grid-template-columns: 1.4fr .7fr .7fr;
      gap: 8px;
    }
    .add-form .row-2 {
      display: grid;
      grid-template-columns: 1fr;
    }
    .add-form label {
      display: block;
      margin: 0 0 5px 2px;
      color: var(--muted);
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 800;
    }
    .add-form input {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(145, 185, 200, .20);
      border-radius: 14px;
      background: var(--field);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
      font-size: .92rem;
      font-weight: 700;
    }
    .add-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .bottom-actions .ghost-btn,
    .bottom-actions .primary-btn {
      min-height: 44px;
      border-radius: 14px;
    }

    .stats-btn {
      width: 100%;
      margin-top: 2px;
      min-height: 46px;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: .75rem;
      text-align: center;
    }

    .bottom-panel { margin-top: 18px; padding-bottom: 12px; }
    .utility-bar {
      position: fixed;
      z-index: 50;
      left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      align-items: center;
      gap: 8px;
      padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: rgba(0, 25, 48, 0.7);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0, 229, 255, .16);
    }
    .utility-timer {
      color: var(--text); font-size: .78rem; font-weight: 900;
      letter-spacing: .02em; white-space: nowrap;
      padding: 8px 9px; border-radius: 10px;
      background: #002548; border: 1px solid rgba(0,229,255,.2);
      font-variant-numeric: tabular-nums;
    }
    .utility-bar button { min-height: 42px; padding: 0 10px; border-radius: 12px; font-size: .76rem; white-space: nowrap; }
    .utility-start { min-width: 0; }
    .utility-stats { min-width: 0; }
    main { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
    .app-header { background: rgba(0,25,48,.92); }
    :root[data-theme="light"] { color-scheme: dark; --bg:#001930; --bg2:#002548; --surface:#002548; --surface-2:#002548; --surface-3:#002548; --card:#002548; --card-strong:#002548; --text:#eef7fb; --muted:#92acb9; --accent:#00e5ff; --accent-2:#00adb5; --accent-soft:rgba(0,229,255,.11); --danger:#ff7589; --danger-soft:rgba(255,117,137,.12); --field:rgba(4,17,24,.34); --ring:rgba(0,229,255,.30); }
    @media (max-width: 380px) {
      .utility-bar { grid-template-columns: auto 1fr; }
      .utility-stats { grid-column: 1 / -1; min-height: 34px !important; }
      .utility-timer { justify-self: start; }
      .utility-start { justify-self: stretch; }
      main { padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      max-width: calc(100% - 24px);
      padding: 12px 15px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface-3);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: .85rem;
      font-weight: 800;
      text-align: center;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .stats-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: rgba(4, 13, 20, .76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .stats-modal.open { display: block; }

    .stats-sheet {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    .stats-top {
      padding: max(12px, env(safe-area-inset-top)) 0 12px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 84%, transparent);
    }

    .stats-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stats-head h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -.04em;
    }

    .close-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .close-btn svg { width: 18px; height: 18px; }

    .stats-body {
      flex: 1;
      overflow: auto;
      padding: 14px 0 calc(18px + env(safe-area-inset-bottom));
    }

    .stats-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 12px;
    }

    .stats-card label {
      display: block;
      margin: 0 0 7px 2px;
      font-size: .7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 800;
    }
    .stats-card select {
      width: 100%;
      min-height: 46px;
      border: 1px solid rgba(145, 185, 200, .20);
      border-radius: 14px;
      background: var(--field);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
      font-weight: 700;
    }

    .chart-wrap {
      height: 320px;
      position: relative;
    }

    .history-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .history-item strong {
      display: block;
      font-size: .9rem;
    }
    .history-item span {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-top: 3px;
    }
    .history-item em {
      font-style: normal;
      color: var(--accent);
      font-weight: 850;
      white-space: nowrap;
    }
    .history-delete {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 100, 120, .35);
      border-radius: 10px;
      background: rgba(255, 80, 105, .10);
      color: #ff8295;
      padding: 8px 10px;
      font: inherit;
      font-size: .75rem;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }
    .history-delete:hover {
      background: rgba(255, 80, 105, .20);
      border-color: rgba(255, 100, 120, .6);
    }
    .history-delete:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    body.rest-flash::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      background: rgba(69, 219, 246, .15);
      animation: pulseFlash .16s linear infinite alternate;
    }

    @keyframes pulseFlash {
      from { opacity: .18; }
      to { opacity: .65; }
    }

    @media (min-width: 720px) {
      .add-form .row {
        grid-template-columns: 2fr .8fr .8fr .9fr;
      }
      .add-form .row-2 {
        grid-template-columns: 1fr auto;
        align-items: end;
      }
      .bottom-actions {
        grid-template-columns: 1fr auto;
        align-items: center;
      }
      .stats-body .shell { width: min(100% - 36px, 760px); }
      .footer-grid {
        grid-template-columns: 1fr;
      }
      .chart-wrap { height: 360px; }
    }

    @media (max-width: 360px) {
      .shell { width: calc(100% - 18px); }
      .day-card { width: 68px; min-height: 68px; border-radius: 20px; }
      .exercise-card { border-radius: 22px; padding: 12px; }
      .exercise-fields { gap: 6px; }
      .mini-field input { min-height: 40px; padding-inline: 9px; }
      .timer-bar { grid-template-columns: 1fr; }
      .timer-actions { justify-content: stretch; }
      .timer-actions button { flex: 1 1 auto; }
      .bottom-actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="shell">
      <div class="header-row">
        <div class="title-wrap">
          <h1>MeuTreino</h1>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema" aria-pressed="false">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="shell">
      <section aria-label="Dias da semana">
        <div class="section-title">
          <h2>Dias da semana</h2>
          <span></span>
        </div>
        <div class="day-strip" id="dayStrip"></div>
      </section>

      <section aria-label="Progresso do treino" class="progress-block">
        <div class="progress-row">
          <strong>Progresso do treino</strong>
          <span class="meta" id="progressLabel">0% concluído</span>
        </div>
        <div class="bar" aria-hidden="true"><span id="progressBar"></span></div>
      </section>

      <section aria-label="Exercícios">
        <div class="section-title">
          <h2>Exercícios</h2>
          <span id="dayMeta">—</span>
        </div>
        <div class="exercise-list" id="exerciseList"></div>
      </section>

      <section class="bottom-panel" aria-label="Controles do app">
        <div class="panel-card">
          <div class="footer-title">Adicionar exercício</div>
          <form id="addForm" class="add-form" autocomplete="off">
            <div class="row-2">
              <div>
                <label for="newName">Nome do exercício</label>
                <input id="newName" type="text" maxlength="80" placeholder="Ex.: Supino reto" required>
              </div>
            </div>
            <div class="row">
              <div>
                <label for="newSets">Séries</label>
                <input id="newSets" type="number" min="1" max="99" step="1" value="3" inputmode="numeric" required>
              </div>
              <div>
                <label for="newReps">Repetições</label>
                <input id="newReps" type="text" maxlength="24" placeholder="Ex.: 8–10" value="8–10" required>
              </div>
              <div>
                <label for="newWeight">Peso atual</label>
                <input id="newWeight" type="text" maxlength="24" placeholder="Ex.: 25 kg">
              </div>
              <div>
                <label style="visibility:hidden">Adicionar</label>
                <button class="primary-btn" type="submit" style="width:100%">Adicionar</button>
              </div>
            </div>
          </form>
        </div>

        <p class="note">Seus dados ficam salvos neste navegador via localStorage.</p>
      </section>
    </div>
  </main>

  <nav class="utility-bar" aria-label="Controles do treino">
    <div class="utility-timer" id="timerDisplay">00:00:00</div>
    <button class="primary-btn utility-start" id="workoutToggleBtn" type="button">Começar Treino</button>
    <button class="ghost-btn utility-stats" id="openStatsBtn" type="button">Ver Estatísticas</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="stats-modal" id="statsModal" aria-hidden="true" aria-label="Estatísticas de carga">
    <div class="stats-sheet">
      <div class="stats-top">
        <div class="shell">
          <div class="stats-head">
            <h2>Estatísticas</h2>
            <button class="close-btn" id="closeStatsBtn" type="button" aria-label="Fechar estatísticas">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="stats-body">
        <div class="shell">
          <div class="stats-card">
            <label for="exerciseSelect">Escolha um exercício</label>
            <select id="exerciseSelect"></select>
          </div>
          <div class="stats-card">
            <div class="chart-wrap"><canvas id="progressChart"></canvas></div>
          </div>
          <div class="stats-card">
            <div class="footer-title" style="margin-bottom:8px">Histórico recente</div>
            <div class="history-list" id="historyList"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'meuTreino.state.v3';
      const OLD_KEY = 'meuTreino.data.v1';
      const THEME_KEY = 'meuTreino.theme.v1';
      const DAYS = [
        { id: 'segunda', short: 'SEG', label: 'Segunda-feira' },
        { id: 'terca', short: 'TER', label: 'Terça-feira' },
        { id: 'quarta', short: 'QUA', label: 'Quarta-feira' },
        { id: 'quinta', short: 'QUI', label: 'Quinta-feira' },
        { id: 'sexta', short: 'SEX', label: 'Sexta-feira' },
        { id: 'sabado', short: 'SÁB', label: 'Sábado' }
      ];

      const $ = (id) => document.getElementById(id);
      const shell = document.querySelector('.shell');
      const dayStrip = $('dayStrip');
      const exerciseList = $('exerciseList');
      const progressLabel = $('progressLabel');
      const progressBar = $('progressBar');
      const dayMeta = $('dayMeta');
      const timerDisplay = $('timerDisplay');
      const workoutToggleBtn = $('workoutToggleBtn');
      const openStatsBtn = $('openStatsBtn');
      const addForm = $('addForm');
      const newName = $('newName');
      const newSets = $('newSets');
      const newReps = $('newReps');
      const newWeight = $('newWeight');
      const themeToggle = $('themeToggle');
      const themeIcon = $('themeIcon');
      const toast = $('toast');
      const statsModal = $('statsModal');
      const closeStatsBtn = $('closeStatsBtn');
      const exerciseSelect = $('exerciseSelect');
      const historyList = $('historyList');
      const progressCanvas = $('progressChart');

      let state = loadState();
      let activeDay = state.activeDay || 'segunda';
      let workoutRunning = false;
      let workoutStart = 0;
      let workoutTick = null;
      let toastTimer = null;
      let chart = null;
      const restTimers = new Map();


      function uid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') return crypto.randomUUID();
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      }

      function blankDay() {
        return [];
      }

      function sampleState() {
        const make = (name, sets, reps, weight) => ({ id: uid(), name, sets: String(sets), reps, weight, done: false });
        return {
          version: 3,
          activeDay: 'segunda',
          theme: 'dark',
          workouts: {
            segunda: [
              make('Supino reto', 4, '8–10', '25 kg'),
              make('Supino inclinado', 3, '10–12', '18 kg'),
              make('Crucifixo na máquina', 3, '12', '30 kg')
            ],
            terca: [
              make('Puxada frontal', 4, '8–12', '35 kg'),
              make('Remada baixa', 3, '10–12', '30 kg'),
              make('Rosca direta', 3, '12', '12 kg')
            ],
            quarta: [
              make('Agachamento', 4, '8–10', '40 kg'),
              make('Leg press', 3, '10–12', '100 kg'),
              make('Cadeira extensora', 3, '12', '30 kg')
            ],
            quinta: [
              make('Desenvolvimento', 3, '10', '12 kg'),
              make('Elevação lateral', 3, '12–15', '6 kg'),
              make('Face pull', 3, '12–15', '15 kg')
            ],
            sexta: [
              make('Terra romeno', 3, '8–10', '35 kg'),
              make('Afundo', 3, '10 cada lado', '10 kg'),
              make('Panturrilha', 4, '15', '20 kg')
            ],
            sabado: [
              make('Prancha', 3, '30–45 s', 'Corpo livre'),
              make('Abdominal na polia', 3, '12–15', '15 kg'),
              make('Caminhada inclinada', 1, '15–20 min', 'Sem carga')
            ]
          },
          history: []
        };
      }

      function ensureShape(raw) {
        if (!raw || typeof raw !== 'object') return sampleState();
        const base = sampleState();
        const workoutsSource = raw.workouts && typeof raw.workouts === 'object' ? raw.workouts : raw;
        const output = {
          version: 3,
          activeDay: DAYS.some(d => d.id === raw.activeDay) ? raw.activeDay : 'segunda',
          theme: raw.theme === 'light' ? 'light' : 'dark',
          workouts: {},
          history: Array.isArray(raw.history) ? raw.history : []
        };

        for (const day of DAYS) {
          const list = Array.isArray(workoutsSource[day.id]) ? workoutsSource[day.id] : base.workouts[day.id];
          output.workouts[day.id] = list.map(item => ({
            id: typeof item.id === 'string' ? item.id : uid(),
            name: String(item.name ?? 'Exercício'),
            sets: String(item.sets ?? '3'),
            reps: String(item.reps ?? '10–12'),
            weight: String(item.weight ?? ''),
            done: Boolean(item.done)
          }));
        }

        output.history = output.history
          .filter(entry => entry && typeof entry === 'object')
          .map(entry => ({
            id: typeof entry.id === 'string' ? entry.id : uid(),
            date: typeof entry.date === 'string' ? entry.date : new Date().toISOString(),
            dayId: DAYS.some(d => d.id === entry.dayId) ? entry.dayId : 'segunda',
            dayLabel: typeof entry.dayLabel === 'string' ? entry.dayLabel : 'Treino',
            exercises: Array.isArray(entry.exercises) ? entry.exercises.map(ex => ({
              name: String(ex?.name ?? 'Exercício'),
              sets: String(ex?.sets ?? ''),
              reps: String(ex?.reps ?? ''),
              weight: String(ex?.weight ?? '')
            })) : []
          }));

        return output;
      }

      function loadState() {
        const saved = readJSON(STORAGE_KEY) || readJSON(OLD_KEY);
        const loaded = ensureShape(saved);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(loaded)); } catch (error) { console.warn(error); }
        return loaded;
      }

      function readJSON(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (_) {
          return null;
        }
      }

      function saveState(target = state) {
        target.activeDay = activeDay;
        target.theme = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(target)); }
        catch (error) { console.warn(error); }
      }

      function currentDay() {
        return DAYS.find(day => day.id === activeDay) || DAYS[0];
      }

      function esc(value) {
        return String(value).replace(/[&<>"]|'/g, (m) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function applyTheme(theme, persist = true) {
        const isLight = theme === 'light';
        document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
        themeToggle.setAttribute('aria-pressed', String(isLight));
        themeToggle.title = isLight ? 'Tema claro ativo' : 'Tema escuro ativo';
        document.querySelector('meta[name=\"theme-color\"]')?.setAttribute('content', isLight ? '#eef4f8' : '#071923');
        themeIcon.innerHTML = isLight
          ? '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.7 8.7 0 1 0 10.7 10.7Z"></path>'
          : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>';
        if (persist) saveState();
      }

      function saveAndRender() {
        saveState();
        renderDays();
        renderExercises();
        updateProgress();
        if (statsModal.classList.contains('open')) {
          refreshStats();
        }
      }

      function renderDays() {
        dayStrip.innerHTML = '';
        for (const day of DAYS) {
          const count = state.workouts[day.id].length;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'day-card';
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', String(day.id === activeDay));
          btn.innerHTML = `<span><span class="short">${day.short}</span><span class="count">${count} ${count === 1 ? 'treino' : 'treinos'}</span></span>`;
          btn.addEventListener('click', () => {
            activeDay = day.id;
            renderDays();
            renderExercises();
            updateProgress();
            saveState();
          });
          dayStrip.appendChild(btn);
        }
      }

      function updateProgress() {
        const list = state.workouts[activeDay];
        const total = list.length;
        const done = list.filter(item => item.done).length;
        const percent = total ? Math.round((done / total) * 100) : 0;
        progressBar.style.width = percent + '%';
        progressLabel.textContent = percent + '% concluído';
        dayMeta.textContent = currentDay().label + ' · ' + total + ' exercício' + (total === 1 ? '' : 's');
      }

      function renderExercises() {
        exerciseList.innerHTML = '';
        const list = state.workouts[activeDay];

        if (!list.length) {
          exerciseList.innerHTML = '<div class="empty-card"><strong>Sem exercícios neste dia</strong>Adicione um exercício no formulário de baixo.</div>';
          return;
        }

        list.forEach((exercise) => {
          const card = document.createElement('article');
          card.className = 'exercise-card';
          card.dataset.id = exercise.id;

          const head = document.createElement('div');
          head.className = 'exercise-head';

          const check = document.createElement('label');
          check.className = 'done-wrap';
          check.innerHTML = `<input type="checkbox" ${exercise.done ? 'checked' : ''} aria-label="Marcar exercício concluído"><span></span>`;
          const checkbox = check.querySelector('input');
          checkbox.addEventListener('change', () => {
            exercise.done = checkbox.checked;
            saveState();
            updateProgress();
          });

          const name = document.createElement('input');
          name.className = 'exercise-name';
          name.type = 'text';
          name.value = exercise.name;
          name.maxLength = 80;
          name.placeholder = 'Nome do exercício';
          name.dataset.field = 'name';
          name.addEventListener('input', () => {
            exercise.name = name.value;
            saveState();
            if (statsModal.classList.contains('open')) refreshStats();
          });

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'icon-btn';
          remove.title = 'Remover exercício';
          remove.setAttribute('aria-label', 'Remover exercício');
          remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m2 0-1 14H7L6 6m4 4v6m4-6v6"/></svg>';
          remove.addEventListener('click', () => {
            const idx = state.workouts[activeDay].findIndex(item => item.id === exercise.id);
            if (idx >= 0) state.workouts[activeDay].splice(idx, 1);
            clearRestTimer(exercise.id);
            saveAndRender();
            showToast('Exercício removido.');
          });

          head.append(check, name, remove);

          const fields = document.createElement('div');
          fields.className = 'exercise-fields';
          fields.append(
            field('Séries', exercise.sets, 'text', 'sets', exercise),
            field('Repetições', exercise.reps, 'text', 'reps', exercise),
            field('Peso atual', exercise.weight, 'text', 'weight', exercise, 'Ex.: 25 kg')
          );

          const restRow = document.createElement('div');
          restRow.className = 'rest-row';
          const restBtn = document.createElement('button');
          restBtn.type = 'button';
          restBtn.className = 'rest-btn';
          restBtn.textContent = 'Descansar (60s)';
          const skipBtn = document.createElement('button');
          skipBtn.type = 'button';
          skipBtn.className = 'skip-btn';
          skipBtn.textContent = 'Pular';
          skipBtn.hidden = true;
          restBtn.addEventListener('click', () => startRestTimer(exercise.id, restBtn, skipBtn));
          skipBtn.addEventListener('click', () => clearRestTimer(exercise.id, true));
          restRow.append(restBtn, skipBtn);

          card.append(head, fields, restRow);
          exerciseList.appendChild(card);

          syncRestButton(exercise.id);
        });
      }

      function field(labelText, value, type, fieldName, exercise, placeholder = '') {
        const wrap = document.createElement('div');
        wrap.className = 'mini-field';
        const label = document.createElement('label');
        label.textContent = labelText;
        const input = document.createElement('input');
        input.type = type;
        input.value = value;
        if (placeholder) input.placeholder = placeholder;
        input.dataset.id = exercise.id;
        input.dataset.field = fieldName;
        if (fieldName === 'sets') {
          input.min = '1';
          input.max = '99';
          input.inputMode = 'numeric';
        }
        input.addEventListener('input', () => {
          exercise[fieldName] = input.value;
          saveState();
          if (statsModal.classList.contains('open')) refreshStats();
        });
        wrap.append(label, input);
        return wrap;
      }

      function syncRestButton(id) {
        const timer = restTimers.get(id);
        const card = exerciseList.querySelector(`.exercise-card[data-id="${id}"]`);
        if (!card) return;
        const btn = card.querySelector('.rest-btn');
        const skip = card.querySelector('.skip-btn');
        if (!btn || !skip) return;
        if (timer && timer.running) {
          btn.classList.add('is-running');
          btn.textContent = `Descanso: ${timer.remaining}s`;
          skip.hidden = false;
        } else {
          btn.classList.remove('is-running');
          btn.textContent = 'Descansar (60s)';
          skip.hidden = true;
        }
      }

      function startRestTimer(id, btn, skipBtn) {
        const existing = restTimers.get(id);
        if (existing?.running) return;
        clearRestTimer(id, false);
        const timer = {
          running: true,
          remaining: 60,
          interval: null,
          btn,
          skipBtn
        };
        restTimers.set(id, timer);
        syncRestButton(id);
        timer.interval = setInterval(() => {
          timer.remaining -= 1;
          syncRestButton(id);
          if (timer.remaining <= 0) {
            clearRestTimer(id, false);
            flashAndBeep();
            showToast('O descanso terminou.');
          }
        }, 1000);
      }

      function clearRestTimer(id, silent) {
        const timer = restTimers.get(id);
        if (!timer) return;
        if (timer.interval) clearInterval(timer.interval);
        restTimers.delete(id);
        syncRestButton(id);
        if (!silent) return;
      }

      function flashAndBeep() {
        document.body.classList.add('rest-flash');
        setTimeout(() => document.body.classList.remove('rest-flash'), 1500);
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const audio = new AudioCtx();
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.value = 0.0001;
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.12, audio.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.18);
          osc.stop(audio.currentTime + 0.2);
          osc.onended = () => audio.close?.();
        } catch (error) {
          console.warn(error);
        }
        if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
      }

      function startWorkoutTimer() {
        if (workoutRunning) return;
        workoutRunning = true;
        workoutStart = Date.now();
        workoutToggleBtn.textContent = 'Finalizar Treino';
        showToast('Treino iniciado.');
        workoutTick = setInterval(() => {
          timerDisplay.textContent = formatDuration(Date.now() - workoutStart);
        }, 1000);
        timerDisplay.textContent = '00:00:00';
      }

      function stopWorkoutTimer() {
        if (!workoutRunning) return;
        workoutRunning = false;
        workoutToggleBtn.textContent = 'Começar Treino';
        clearInterval(workoutTick);
        workoutTick = null;
        timerDisplay.textContent = '00:00:00';
      }

      function finishWorkout() {
        const day = currentDay();
        const list = state.workouts[activeDay];
        state.history.unshift({
          id: uid(),
          date: new Date().toISOString(),
          dayId: activeDay,
          dayLabel: day.label,
          exercises: list.map(ex => ({
            name: ex.name,
            sets: ex.sets,
            reps: ex.reps,
            weight: ex.weight
          }))
        });
        list.forEach(ex => { ex.done = false; });
        for (const key of [...restTimers.keys()]) clearRestTimer(key, false);
        stopWorkoutTimer();
        saveState();
        renderDays();
        renderExercises();
        updateProgress();
        showToast('Treino finalizado e salvo no histórico.');
        if (statsModal.classList.contains('open')) refreshStats();
      }

      function formatDuration(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const h = String(Math.floor(total / 3600)).padStart(2, '0');
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
        const s = String(total % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
      }

      function parseWeight(value) {
        const match = String(value).replace(',', '.').match(/-?\d+(?:\.\d+)?/);
        if (!match) return null;
        const num = Number(match[0]);
        return Number.isFinite(num) ? num : null;
      }

      function uniqueExerciseNames() {
        const names = new Set();
        for (const day of DAYS) {
          for (const ex of state.workouts[day.id]) {
            if (ex.name && ex.name.trim()) names.add(ex.name.trim());
          }
        }
        for (const entry of state.history) {
          for (const ex of entry.exercises || []) {
            if (ex.name && ex.name.trim()) names.add(ex.name.trim());
          }
        }
        return [...names].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      }

      function refreshStats() {
        const names = uniqueExerciseNames();
        if (!names.length) {
          exerciseSelect.innerHTML = '<option value="">Sem exercícios</option>';
          renderHistory();
          renderChart('');
          return;
        }
        const currentValue = exerciseSelect.value;
        exerciseSelect.innerHTML = names.map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');
        exerciseSelect.value = names.includes(currentValue) ? currentValue : names[0];
        renderHistory();
        renderChart(exerciseSelect.value);
      }

      function renderHistory() {
        historyList.innerHTML = '';
        const entries = state.history.slice(0, 6);
        if (!entries.length) {
          historyList.innerHTML = '<div class="empty-card" style="margin:0"><strong>Sem histórico ainda</strong>Finalize um treino para salvar a evolução das cargas.</div>';
          return;
        }
        entries.forEach(entry => {
          const item = document.createElement('div');
          item.className = 'history-item';
          const date = new Date(entry.date);
          const label = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }).format(date);
          const count = entry.exercises?.length || 0;
          item.innerHTML = `<div><strong>${esc(entry.dayLabel)}</strong><span>${esc(label)} · ${count} exercício${count === 1 ? '' : 's'}</span></div><button class="history-delete" type="button" data-delete-history="${esc(entry.id)}" aria-label="Excluir treino de ${esc(label)}">Excluir</button>`;
          historyList.appendChild(item);
        });
      }

      function renderChart(exerciseName) {
        const ctx = progressCanvas.getContext('2d');
        const points = [];
        for (const entry of [...state.history].reverse()) {
          const found = (entry.exercises || []).find(ex => ex.name.trim() === exerciseName.trim());
          if (!found) continue;
          const value = parseWeight(found.weight);
          if (value === null) continue;
          points.push({ date: new Date(entry.date), value });
        }

        const labels = points.map(point => new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit' }).format(point.date));
        const data = points.map(point => point.value);

        if (chart) {
          chart.destroy();
          chart = null;
        }

        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: exerciseName || 'Carga',
              data,
              tension: .35,
              borderWidth: 3,
              borderColor: '#00e5ff',
              backgroundColor: 'rgba(0,229,255,.12)',
              pointRadius: 4,
              pointHoverRadius: 6,
              pointBackgroundColor: '#00e5ff',
              pointBorderColor: '#eaffff',
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(5, 15, 21, .94)',
                borderColor: 'rgba(0,229,255,.34)',
                borderWidth: 1,
                titleColor: '#fff',
                bodyColor: '#fff'
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(145, 185, 200, .10)' },
                ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#92acb9' }
              },
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(145, 185, 200, .10)' },
                ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#92acb9' }
              }
            }
          }
        });

        if (!points.length) {
          const overlay = document.createElement('div');
          overlay.className = 'empty-card';
          overlay.style.marginTop = '10px';
          overlay.innerHTML = '<strong>Sem dados suficientes</strong>Finalize treinos com este exercício para ver a progressão.';
          const parent = progressCanvas.parentElement;
          if (parent && !parent.querySelector('.empty-card')) parent.appendChild(overlay);
        } else {
          const existing = progressCanvas.parentElement.querySelector('.empty-card');
          if (existing) existing.remove();
        }
      }

      function openStats() {
        statsModal.classList.add('open');
        statsModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        refreshStats();
        setTimeout(() => chart?.resize(), 50);
      }

      function closeStats() {
        statsModal.classList.remove('open');
        statsModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        applyTheme(next);
        showToast(next === 'light' ? 'Tema claro ativado.' : 'Tema escuro ativado.');
      });

      workoutToggleBtn.addEventListener('click', () => {
        if (workoutRunning) {
          finishWorkout();
          showToast('Treino finalizado.');
        } else {
          startWorkoutTimer();
        }
      });


      addForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = newName.value.trim();
        const sets = String(newSets.value).trim();
        const reps = newReps.value.trim();
        const weight = newWeight.value.trim();
        if (!name) return newName.focus();
        if (!sets || Number(sets) < 1 || Number(sets) > 99) return newSets.focus();
        if (!reps) return newReps.focus();
        state.workouts[activeDay].push({ id: uid(), name, sets, reps, weight, done: false });
        saveAndRender();
        addForm.reset();
        newSets.value = '3';
        newReps.value = '8–10';
        newName.focus();
        showToast('Exercício adicionado.');
      });

      openStatsBtn.addEventListener('click', openStats);
      closeStatsBtn.addEventListener('click', closeStats);
      statsModal.addEventListener('click', (event) => {
        if (event.target === statsModal) closeStats();
      });
      exerciseSelect.addEventListener('change', () => renderChart(exerciseSelect.value));
      historyList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-delete-history]');
        if (!button) return;
        const entryId = button.dataset.deleteHistory;
        const entry = state.history.find(item => item.id === entryId);
        if (!entry) return;
        if (!window.confirm('Deseja excluir este treino do histórico? Esta ação não pode ser desfeita.')) return;
        state.history = state.history.filter(item => item.id !== entryId);
        saveState();
        refreshStats();
        showToast('Treino removido do histórico.');
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && statsModal.classList.contains('open')) closeStats();
      });

      function init() {
        activeDay = state.activeDay || 'segunda';
        renderDays();
        renderExercises();
        updateProgress();
        if (state.theme === 'light') applyTheme('light', false);
        else applyTheme('dark', false);
      }

      init();
      saveState();
    })();

    // Registra o cache do app para carregamento mais confiável no iPhone.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => console.warn('Service worker indisponível:', error));
      });
    }
  </script>
</body>
</html>
